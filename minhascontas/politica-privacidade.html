<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Política de privacidade | Minhas contas</title>
    <style>
      :root { color-scheme: light dark; font-family: Arial, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f5f5; color: #111; }
      main { width: min(100%, 560px); box-sizing: border-box; padding: 32px; border: 1px solid #d8d8d8; background: #fff; }
      .brand { color: #0033a0; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
      h1 { margin: 14px 0 10px; font-size: clamp(28px, 7vw, 40px); }
      p { color: #555; line-height: 1.6; }
      a { display: inline-flex; min-height: 48px; align-items: center; margin-top: 16px; padding: 0 18px; background: #111; color: #fff; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #0033a0; outline-offset: 3px; }
      @media (prefers-color-scheme: dark) { body { background: #111; color: #f5f5f5; } main { background: #181818; border-color: #444; } p { color: #bbb; } a { background: #f5f5f5; color: #111; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">MINHAS CONTAS</div>
      <h1>Política de privacidade</h1>
      <p>O documento completo e atualizado está publicado no endereço oficial do Minhas contas.</p>
      <a href="https://localplatze.github.io/PlatzeTerms/minhascontas/politica-privacidade" rel="noopener">Ler a política de privacidade</a>
    </main>
  </body>
</html>
